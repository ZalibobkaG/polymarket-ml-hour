# Пример settings.toml — переопределения параметров бота поверх config.py.
#
# Как пользоваться: скопировать этот файл в settings.toml (рядом, в корне
# репозитория) и поменять там нужные значения. settings.toml не в git — не
# перезапишется при обновлении из репозитория и не потеряется при git pull.
# Ключи те же, что переменные в config.py; можно оставить только те, что
# действительно хотите поменять, остальные останутся по умолчанию.
#
# Неверное значение или неизвестный ключ — бот не запустится, в ошибке будет
# сказано, что не так и что допустимо. Секреты (приватный ключ, API-ключи,
# токен телеграма) сюда переносить нельзя — они остаются только в .env.

# --- монета ------------------------------------------------------------
# Какую монету торгует этот процесс. Допустимо: "btc" или "eth".
COIN = "btc"

# --- режим ---------------------------------------------------------------
# Бумажный режим: true — бот считает и пишет всё, но ордера на биржу не
# отправляет; false — торгует по-настоящему. Допустимо: true или false.
DRY_RUN = true

# Аварийный рубильник: false — новых ордеров не ставим, начатые доводим до
# резолва. Допустимо: true или false.
TRADING_ENABLED = true

# Когда выставляем заявку: "early" — заранее по частичной свече, "fresh" — в
# начале часа по полной. Допустимо: "early" или "fresh".
ENTRY_MODE = "early"

# За сколько секунд до начала часа выставляем заявку в режиме "early".
# Допустимо: целое число секунд, от 30 до 3600.
EARLY_SECONDS = 120

# На сколько минут обрезана последняя свеча в признаках — должно совпадать с
# тем, на чём обучена модель. Допустимо: целое число минут, от 1 до 10.
CUTOFF_MINUTES = 2

# Сколько суток минутных свечей Binance грузить для признаков. Больше — точнее
# скользящие статистики, но дольше первый запуск. Допустимо: целое число суток,
# без формального верхнего предела в проверке (мера — здравый смысл).
HISTORY_DAYS = 60

# --- комиссии ------------------------------------------------------------
# Ставка комиссии тейкера на Polymarket (доля, не проценты). Допустимо: число
# от 0 до 0.20.
FEE_RATE = 0.07

# Какая доля собранной комиссии идёт мейкеру ребейтом. Допустимо: число от 0
# до 1.
MAKER_REBATE_SHARE = 0.20

# --- исполнение ----------------------------------------------------------
# Цена лимитной заявки на вход (в долях доллара, не в центах). Допустимо:
# число от 0.30 до 0.70, кратное 0.01 (то есть кратное одному центу).
LIMIT_PRICE = 0.51

# Пассивная заявка (post-only): true — не исполняется сразу тейкером, если
# рынок уже готов дать эту цену; false — исполняется сразу, если можно.
# Допустимо: true или false.
POST_ONLY = false

# На этой секунде после начала часа остаток лимитной заявки снимается и
# добирается тейкером. Допустимо: целое число секунд, от 60 до 3000, строго
# меньше CROSS_LATEST_SECONDS.
CROSS_AFTER_SECONDS = 720

# Позже этого момента добор тейкером уже не делаем, даже если бот опоздал.
# Допустимо: целое число секунд, больше CROSS_AFTER_SECONDS и не больше 3300.
CROSS_LATEST_SECONDS = 1200

# Потолок цены добора тейкером: если лучший аск выше — не добираем. Допустимо:
# число от 0.30 до 0.99, не ниже LIMIT_PRICE.
TAKER_MAX = 0.55

# На сколько шагов цены выше лучшего аска ставим заявку при доборе тейкером
# (чтобы исполниться, даже если аск чуть сдвинулся). Допустимо: целое число
# шагов цены, без отдельного диапазона в проверке.
TAKER_SLIPPAGE_TICKS = 1

# Пауза перед повторной попыткой поставить заявку, если её отклонили.
# Допустимо: целое число секунд, без отдельного диапазона в проверке.
RETRY_SECONDS = 5

# Сколько секунд одного тика тратить на повторные попытки поставить заявку.
# Допустимо: целое число секунд, без отдельного диапазона в проверке.
RETRY_BURST_SECONDS = 20

# --- ставка --------------------------------------------------------------
# Размер ставки в шейрах. Допустимо: целое число, не меньше 5 (минимум биржи).
SHARES = 10

# Выше этой цены новую ставку не открываем (решение, не исполнение — потолок
# исполнения см. TAKER_MAX). Допустимо: число от 0.30 до 0.99, не ниже
# LIMIT_PRICE.
MAX_ENTRY_PRICE = 0.55

# --- риск ------------------------------------------------------------------
# Сколько рынков можно держать открытыми одновременно. Допустимо: целое число
# от 1 до 10.
MAX_OPEN_POSITIONS = 3

# Дневной лимит убытка в долларах — при достижении новых ставок в этот день
# больше нет. Допустимо: число больше 0.
DAILY_LOSS_LIMIT_USD = 40.0

# Месячный лимит убытка в долларах — та же логика, на месяц. Допустимо: число,
# не меньше DAILY_LOSS_LIMIT_USD.
MONTHLY_LOSS_LIMIT_USD = 300.0
